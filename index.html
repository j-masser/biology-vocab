<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biology Vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Biology Vocab</div>
      <h1>Key Terms Review</h1>
    </div>
    <div class="progress">
      <div class="who" id="who"></div>
      <div class="meters" id="meters"></div>
    </div>
  </header>

  <section class="panel gate" id="gate" aria-live="polite"><p class="muted">Loading…</p></section>

  <div id="app" hidden>
    <div id="dataProblems"></div>
    <nav class="modes" role="tablist" aria-label="Study path">
      <button role="tab" data-mode="review">Daily Review <span class="duebadge" id="duebadge" hidden></span></button>
      <button role="tab" data-mode="cards"><span class="num">1</span>Flashcards</button>
      <button role="tab" data-mode="recog"><span class="num">2</span>Recognition</button>
      <button role="tab" data-mode="recall"><span class="num">3</span>Recall</button>
      <span class="navsep" aria-hidden="true"></span>
      <button role="tab" data-mode="list">Word List</button>
    </nav>
    <div class="units" id="units" aria-label="Choose a topic"></div>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>

  <footer>Your progress and answers are saved to your school account so your teacher can see what to review.</footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
